name: v0.0.27 isolated native QA
on:
  push:
    branches: [godot]
    paths:
      - 'game/**'
      - 'design/tools/**'
      - '.github/workflows/v027-native-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch and verify exact Godot archive
        shell: pwsh
        run: |
          if ($IsWindows) {
            $asset = 'Godot_v4.7.2-stable_win64.exe.zip'
            $digest = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          } else {
            $asset = 'Godot_v4.7.2-stable_linux.x86_64.zip'
            $digest = 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4'
          }
          $archive = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$asset" -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $digest) { throw 'Godot archive SHA256 mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Expand-Archive $archive $dir
          if ($IsWindows) {
            $exe = Get-ChildItem $dir -Recurse -File -Filter '*console.exe' | Select-Object -First 1
            if (!$exe) { throw 'Console Godot executable unavailable' }
          } else {
            $exe = Get-ChildItem $dir -Recurse -File -Filter 'Godot_v4.7.2-stable_linux.x86_64' | Select-Object -First 1
            if (!$exe) { throw 'Linux Godot executable unavailable' }
            chmod +x $exe.FullName
          }
          "GODOT_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Audit pinned bytes and execute isolated suites
        shell: pwsh
        run: |
          python design/tools/run_native_qa.py --repo . --ref $env:GITHUB_SHA --godot $env:GODOT_EXE --logs (Join-Path $env:RUNNER_TEMP 'native-qa-logs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Print native suite report and failure diagnostics
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'native-qa-logs'
          if (Test-Path "$logs/report.json") { Get-Content "$logs/report.json" }
          if (Test-Path $logs) {
            Get-ChildItem $logs -File -Filter '*.log' | ForEach-Object {
              $errors = Select-String -Path $_.FullName -Pattern 'SCRIPT ERROR:|ERROR:|FAIL|TIMEOUT'
              if ($errors) { Write-Output $_.Name; $errors | Select-Object -First 25 | ForEach-Object { Write-Output $_.Line } }
            }
          }
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qa-${{ matrix.os }}
          path: ${{ runner.temp }}/native-qa-logs
          if-no-files-found: warn
          retention-days: 14
